# Free Node.js hosting (sleeps after 15 min idle, ~1 min to wake). Good for a demo.
# Move this file to the repo root, then Render > New > Blueprint.
services:
  - type: web
    name: vaani-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: node src/node.js
    healthCheckPath: /healthz
    envVars:
      - key: TRUST_PROXY # Render's proxy sets X-Forwarded-For
        value: "1"
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
